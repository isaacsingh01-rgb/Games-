<script>
const st=document.getElementById('st');
function ok(){st.textContent='✓ Saved for offline play';st.className='ok'}
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{ok()}).catch(()=>{st.textContent='Offline mode needs https (GitHub Pages)'});
}else st.textContent='Offline mode needs https (GitHub Pages)';
</script></body></html>
