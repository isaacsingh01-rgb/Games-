<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minesweeper</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#1e2430;color:#e8ecf3;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:14px;user-select:none}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
select,button{background:#2c3547;color:#e8ecf3;border:1px solid #3d4a63;border-radius:6px;padding:8px 12px;font-size:15px;cursor:pointer;transition:transform .12s,background .15s,filter .15s}
button:hover{filter:brightness(1.15)}button:active{transform:scale(.94)}
button.on{background:#3b82f6;border-color:#3b82f6}
.stat{background:#10151f;border-radius:6px;padding:6px 12px;font-variant-numeric:tabular-nums;font-weight:700;min-width:64px;text-align:center}
#grid{display:grid;gap:2px;background:#10151f;padding:6px;border-radius:8px;max-width:100%;overflow:auto}
.c{width:var(--s);height:var(--s);background:#3a4660;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--s)*.58);cursor:pointer;
 transition:background-color .15s,transform .1s,filter .12s}
.c:not(.o):hover{filter:brightness(1.25)}
.c:not(.o):active{transform:scale(.88)}
.c.o{background:#202838;cursor:default}
.c.m.o{background:#7f1d1d}
.c.w{background:#b91c1c}
.e{display:inline-block;font-size:calc(var(--s)*.55);line-height:1}
.n1{color:#60a5fa}.n2{color:#4ade80}.n3{color:#f87171}.n4{color:#a78bfa}.n5{color:#fb923c}.n6{color:#22d3ee}.n7{color:#e5e7eb}.n8{color:#9ca3af}
#status{margin-top:12px;font-weight:700;min-height:24px}
small{opacity:.7;margin-top:8px;text-align:center}
</style></head><body>
<div class="bar">
<select id="lvl"><option value="9,9,10">Easy 9×9</option><option value="16,16,40">Medium 16×16</option><option value="16,30,99">Hard 16×30</option></select>
<span class="stat" id="mines">💣 10</span><button id="face">🙂 New</button><span class="stat" id="time">0</span>
<button id="flagmode">🚩 Flag mode</button>
</div>
<div id="grid"></div>
<div id="status"></div>
<small>Click to reveal · right-click or Flag mode to flag · click a number to chord</small>
<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const anim=(el,kf,o)=>{if(!RM&&el&&el.animate)return el.animate(kf,o)};
let R,C,M,cells,started,done,flags,timer,secs,flagMode=false;
const grid=document.getElementById('grid'),status=document.getElementById('status');
function init(){
 [R,C,M]=document.getElementById('lvl').value.split(',').map(Number);
 clearInterval(timer);secs=0;started=done=false;flags=0;document.getElementById('time').textContent=0;
 cells=Array.from({length:R*C},()=>({m:false,o:false,f:false,n:0,delay:0}));
 const s=Math.max(22,Math.min(36,Math.floor((Math.min(innerWidth-40,900))/C)-2));
 grid.style.setProperty('--s',s+'px');grid.style.gridTemplateColumns=`repeat(${C},var(--s))`;
 grid.innerHTML='';
 cells.forEach((_,i)=>{const d=document.createElement('div');d.className='c';d.dataset.i=i;
  anim(d,[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1)'}],{duration:260,delay:((Math.floor(i/C)+i%C)*14),fill:'backwards',easing:'ease-out'});
  grid.appendChild(d)});
 upd();status.textContent='';document.getElementById('face').textContent='🙂 New';
}
function nb(i){const r=Math.floor(i/C),c=i%C,o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;if(rr>=0&&rr<R&&cc>=0&&cc<C)o.push(rr*C+cc)}return o}
function place(safe){
 const ban=new Set([safe,...nb(safe)]);let p=0;
 while(p<M){const i=Math.floor(Math.random()*R*C);if(cells[i].m||ban.has(i))continue;cells[i].m=true;p++}
 cells.forEach((c,i)=>c.n=nb(i).filter(j=>cells[j].m).length);
}
// breadth-first reveal so the animation ripples outward from the click
function reveal(start,base=0){
 const q=[[start,base]];
 for(let h=0;h<q.length;h++){const [k,d]=q[h],c=cells[k];if(c.o||c.f)continue;c.o=true;c.delay=Math.min(d,40)*28;
  if(!c.m&&c.n===0)nb(k).forEach(j=>{if(!cells[j].o&&!cells[j].f)q.push([j,d+1])})}
}
function act(i,flag){
 if(done)return;const c=cells[i];
 if(flag){if(c.o)return;c.f=!c.f;flags+=c.f?1:-1;upd();return}
 if(c.f)return;
 if(c.o){
  if(c.n>0&&nb(i).filter(j=>cells[j].f).length===c.n){
   const hit=nb(i).find(j=>!cells[j].f&&!cells[j].o&&cells[j].m);
   if(hit!==undefined){lose(hit);upd();return}
   nb(i).forEach(j=>{if(!cells[j].f&&!cells[j].o)reveal(j,1)});
  }
  if(!done)check();upd();return}
 if(!started){started=true;place(i);timer=setInterval(()=>{secs++;document.getElementById('time').textContent=secs},1000)}
 if(c.m){lose(i);upd();return}
 reveal(i);check();upd();
}
function lose(i){done=true;clearInterval(timer);
 const mines=[];cells.forEach((c,k)=>{if(c.m&&!c.o)mines.push(k)});
 const cr=Math.floor(i/C),cc=i%C;
 mines.sort((a,b)=>Math.hypot(Math.floor(a/C)-cr,a%C-cc)-Math.hypot(Math.floor(b/C)-cr,b%C-cc));
 mines.forEach((k,n)=>{cells[k].o=true;cells[k].delay=Math.min(n,30)*55});
 cells[i].boom=true;cells[i].delay=0;
 anim(grid,[{transform:'translate(0)'},{transform:'translate(-6px,3px)'},{transform:'translate(5px,-3px)'},{transform:'translate(-3px,2px)'},{transform:'translate(0)'}],{duration:380,delay:80,easing:'ease-out'});
 status.textContent='💥 Boom. Better luck next time.';document.getElementById('face').textContent='😵 New'}
function check(){if(done)return;if(cells.every(c=>c.m||c.o)){done=true;clearInterval(timer);cells.forEach(c=>{if(c.m&&!c.f){c.f=true;flags++}});
 status.textContent=`🎉 Cleared in ${secs}s`;document.getElementById('face').textContent='😎 New';
 upd();
 [...grid.children].forEach((d,i)=>anim(d,[{transform:'scale(1)',filter:'brightness(1)'},{transform:'scale(1.25)',filter:'brightness(1.8)',offset:.4},{transform:'scale(1)',filter:'brightness(1)'}],{duration:520,delay:(Math.floor(i/C)+i%C)*28,easing:'ease-in-out'}));
 anim(status,[{transform:'scale(.6)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:400,easing:'cubic-bezier(.2,.9,.3,1.3)'})}}
function upd(){
 for(let i=0;i<cells.length;i++){
  const c=cells[i],d=grid.children[i];
  const key=(c.o?'o':'')+(c.m?'m':'')+(c.f?'f':'')+(c.boom?'b':'')+c.n;
  if(d._k===key)continue;
  const prev=d._k||'';d._k=key;
  let cls='c';if(c.o)cls+=' o';if(c.m&&c.o)cls+=' m';if(c.boom)cls+=' w';if(c.o&&!c.m&&c.n)cls+=' n'+c.n;
  d.className=cls;
  if(c.o&&c.m)d.innerHTML='<span class="e">💣</span>';
  else if(c.f&&!c.o)d.innerHTML='<span class="e">🚩</span>';
  else d.textContent=(c.o&&c.n)?c.n:'';
  if(c.o&&!prev.startsWith('o')){
   if(c.m)anim(d,[{transform:'scale(.3)',filter:'brightness(3)'},{transform:'scale(1.5)',filter:'brightness(2)',offset:.4},{transform:'scale(1)',filter:'brightness(1)'}],{duration:420,delay:c.delay,fill:'backwards',easing:'ease-out'});
   else anim(d,[{backgroundColor:'#3a4660',color:'transparent',transform:'scale(.82)'},{transform:'scale(1.1)',offset:.6},{transform:'scale(1)'}],{duration:240,delay:c.delay,fill:'backwards',easing:'ease-out'});
  } else if(c.f&&!c.o&&!prev.includes('f'))anim(d.firstChild,[{transform:'translateY(-14px) scale(1.6)',opacity:0},{transform:'translateY(0) scale(1)',opacity:1}],{duration:220,easing:'cubic-bezier(.2,.9,.3,1.3)'});
 }
 const m=document.getElementById('mines'),txt='💣 '+(M-flags);if(m.textContent!==txt){m.textContent=txt}
}
let lp;
grid.addEventListener('click',e=>{const d=e.target.closest('.c');if(d&&!lp)act(+d.dataset.i,flagMode);lp=false});
grid.addEventListener('contextmenu',e=>{e.preventDefault();const d=e.target.closest('.c');if(d)act(+d.dataset.i,true)});
grid.addEventListener('touchstart',e=>{const d=e.target.closest('.c');if(!d)return;lp=false;clearTimeout(grid._t);grid._t=setTimeout(()=>{lp=true;act(+d.dataset.i,true)},450)},{passive:true});
['touchend','touchmove','touchcancel'].forEach(ev=>grid.addEventListener(ev,()=>clearTimeout(grid._t),{passive:true}));
document.getElementById('face').onclick=init;
document.getElementById('lvl').onchange=init;
document.getElementById('flagmode').onclick=e=>{flagMode=!flagMode;e.target.classList.toggle('on',flagMode)};
init();
</script><style>#__home{position:fixed;top:0;left:50%;transform:translateX(-50%);width:64px;height:22px;z-index:99999;display:none;align-items:flex-start;justify-content:center;text-decoration:none}
#__home i{display:block;width:40px;height:15px;border-radius:0 0 10px 10px;background:rgba(120,130,150,.55);color:#fff;font:600 11px/15px system-ui;text-align:center;font-style:normal}
@media (display-mode:standalone){#__home{display:flex}}</style>
<a id="__home" href="./" aria-label="Back to games"><i>⌂ Home</i></a>
<script>if(window.navigator.standalone)document.getElementById('__home').style.display='flex'</script>
</body></html>
