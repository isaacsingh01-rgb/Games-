<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Word Guess</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--t:min(15vw,62px)}
body{margin:0;background:#121213;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px;user-select:none;overflow-x:hidden}
header{width:min(100%,500px);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3a3a3c;padding:4px 4px 8px;margin-bottom:14px}
h1{margin:0;font-size:26px;letter-spacing:2px}
header button{background:none;border:1px solid #565758;color:#fff;border-radius:6px;padding:6px 10px;font-size:14px;cursor:pointer;transition:transform .12s,background .15s}
header button:hover{background:#2a2a2c}header button:active{transform:scale(.94)}
#board{display:grid;gap:5px}
.row{display:grid;grid-template-columns:repeat(5,var(--t));gap:5px}
.tile{width:var(--t);height:var(--t);border:2px solid #3a3a3c;display:flex;align-items:center;justify-content:center;font-size:calc(var(--t)*.52);font-weight:800;text-transform:uppercase}
.tile.filled{border-color:#565758}
.tile.correct{background:#538d4e;border-color:#538d4e}.tile.present{background:#b59f3b;border-color:#b59f3b}.tile.absent{background:#3a3a3c;border-color:#3a3a3c}
#kb{margin-top:20px;display:flex;flex-direction:column;gap:7px;width:min(100%,500px)}
.kr{display:flex;justify-content:center;gap:6px}
.k{flex:1;max-width:44px;height:54px;border:0;border-radius:5px;background:#818384;color:#fff;font-weight:700;font-size:14px;text-transform:uppercase;cursor:pointer;transition:background .25s,transform .08s}
.k.w{flex:1.6;max-width:68px;font-size:13px}
.k:active{transform:scale(.92)}
.k.correct{background:#538d4e}.k.present{background:#b59f3b}.k.absent{background:#3a3a3c}
#toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:5}
.toast{background:#fff;color:#111;font-weight:700;padding:10px 16px;border-radius:6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:4}
#card{background:#1c1c1e;border:1px solid #3a3a3c;border-radius:12px;padding:20px;width:min(92vw,360px);text-align:center}
#card h2{margin:0 0 4px}#card p{margin:4px 0 12px;opacity:.85}
.stats{display:flex;justify-content:space-around;margin:10px 0}.stats b{display:block;font-size:26px}.stats small{opacity:.7}
.dist{text-align:left;margin:10px 0}.dist div{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:13px}
.dist span{display:block;height:18px;background:#3a3a3c;min-width:18px;padding:0 6px;text-align:right;font-weight:700;border-radius:2px}
.dist span.cur{background:#538d4e}
.btns{display:flex;gap:8px;justify-content:center;margin-top:12px}
.btns button{background:#538d4e;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .12s}
.btns button.g{background:#3a3a3c}.btns button:active{transform:scale(.94)}
</style></head><body>
<header><button id="bs">📊 Stats</button><h1>WORD GUESS</h1><button id="bn">New</button></header>

<div id="kb"></div>
<div id="toasts"></div>
<div id="modal"><div id="card"></div></div>

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const anim=(el,kf,o)=>RM||!el.animate?null:el.animate(kf,o);
const board=document.getElementById('board'),kb=document.getElementById('kb'),modal=document.getElementById('modal'),card=document.getElementById('card');
let target,row,col,busy,over,ks,rows=[];

try{const s=JSON.parse(localStorage.getItem('wordguess'));if(s&&s.dist)stats=s}catch(e){}

const KEYS=['qwertyuiop','asdfghjkl','⏎zxcvbnm⌫'],keyEl={};
KEYS.forEach(s=>{const r=document.createElement('div');r.className='kr';[...s].forEach(ch=>{const b=document.createElement('button');b.className='k'+(ch==='⏎'||ch==='⌫'?' w':'');b.textContent=ch;
 b.onclick=()=>key(ch==='⏎'?'Enter':ch==='⌫'?'Backspace':ch);r.appendChild(b);keyEl[ch]=b});kb.appendChild(r)});
function newGame(){
 target=ANS[Math.floor(Math.random()*ANS.length)];row=0;col=0;busy=false;over=false;ks={};
 rows.forEach(r=>[...r.children].forEach(t=>{t.className='tile';t.textContent='';t.getAnimations().forEach(a=>a.cancel())}));
 Object.values(keyEl).forEach(b=>b.classList.remove('correct','present','absent'));

 rows.forEach((r,i)=>[...r.children].forEach((t,j)=>anim(t,[{opacity:0,transform:'scale(.8)'},{opacity:1,transform:'scale(1)'}],{duration:240,delay:(i+j)*30,fill:'backwards',easing:'ease-out'})));

function toast(msg,ms=1300){
 const t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('toasts').prepend(t);
 anim(t,[{opacity:0,transform:'translateY(-8px)'},{opacity:1,transform:'translateY(0)'}],{duration:150});

}
function evaluate(g,t){
 const res=Array(5).fill('absent'),left={};
 for(let i=0;i<5;i++){if(g[i]===t[i])res[i]='correct';else left[t[i]]=(left[t[i]]||0)+1}
 for(let i=0;i<5;i++)if(res[i]!=='correct'&&left[g[i]]>0){res[i]='present';left[g[i]]--}
 return res;
}
function key(k){
 if(busy||over||modal.style.display==='flex')return;
 if(k==='Enter')return submit();
 if(k==='Backspace'){if(col>0){col--;const t=rows[row].children[col];t.textContent='';t.classList.remove('filled')}return}
 if(/^[a-z]$/i.test(k)&&col<5){const t=rows[row].children[col];t.textContent=k.toLowerCase();t.classList.add('filled');
  anim(t,[{transform:'scale(1)'},{transform:'scale(1.14)',offset:.5},{transform:'scale(1)'}],{duration:110});col++}
}
async function submit(){
 if(col<5){shake();toast('Not enough letters');return}
 const g=[...rows[row].children].map(t=>t.textContent).join('');
 if(!VALID.has(g)){shake();toast('Not in word list');return}
 busy=true;const res=evaluate(g,target),r=row,tiles=[...rows[r].children];
 await Promise.all(tiles.map(async(t,i)=>{
  if(RM){t.classList.add(res[i]);return}
  await sleep(i*270);
  const a=t.animate([{transform:'perspective(400px) rotateX(0)'},{transform:'perspective(400px) rotateX(90deg)'}],{duration:210,easing:'ease-in',fill:'forwards'});
  await a.finished;t.classList.add(res[i]);
  const b=t.animate([{transform:'perspective(400px) rotateX(90deg)'},{transform:'perspective(400px) rotateX(0)'}],{duration:210,easing:'ease-out'});
  await b.finished;a.cancel();
 }));
 const rank={absent:1,present:2,correct:3};
 [...g].forEach((ch,i)=>{if(!ks[ch]||rank[res[i]]>rank[ks[ch]]){ks[ch]=res[i];keyEl[ch].classList.remove('absent','present','correct');keyEl[ch].classList.add(res[i])}});
 if(g===target){over=true;
  tiles.forEach((t,i)=>anim(t,[{transform:'translateY(0)'},{transform:'translateY(-22px)',offset:.35},{transform:'translateY(4px)',offset:.6},{transform:'translateY(0)'}],{duration:620,delay:i*90,easing:'ease-out'}));
  toast(['Genius!','Magnificent!','Impressive!','Splendid!','Great!','Phew!'][r],1600);
  stats.played++;stats.wins++;stats.streak++;stats.max=Math.max(stats.max,stats.streak);stats.dist[r]++;save();
  await sleep(1500);showStats(r);
 }else if(r===5){over=true;toast(target.toUpperCase(),2200);stats.played++;stats.streak=0;save();await sleep(1900);showStats(-1)}
 else{row++;col=0}
 busy=false;
}
function shake(){anim(rows[row],[{transform:'translateX(0)'},{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:340})}
function showStats(cur){
 const mx=Math.max(1,...stats.dist);
 card.innerHTML=`<h2>${cur>=0?'You got it!':cur===-2?'Statistics':'The word was'}</h2><p>${cur>=0?'Solved in '+(cur+1)+' '+(cur?'guesses':'guess'):cur===-2?'':'<b style="font-size:22px;letter-spacing:3px">'+target.toUpperCase()+'</b>'}</p>
 <div class="stats"><div><b>${stats.played}</b><small>Played</small></div><div><b>${stats.played?Math.round(100*stats.wins/stats.played):0}</b><small>Win %</small></div><div><b>${stats.streak}</b><small>Streak</small></div><div><b>${stats.max}</b><small>Best</small></div></div>
 <div class="dist">${stats.dist.map((n,i)=>`<div>${i+1}<span class="${i===cur?'cur':''}" data-w="${Math.max(8,100*n/mx)}" style="width:0">${n}</span></div>`).join('')}</div>
 <div class="btns"><button class="g" id="cl">Close</button><button id="pa">Play again</button></div>`;
 modal.style.display='flex';
 anim(modal,[{opacity:0},{opacity:1}],{duration:200});anim(card,[{transform:'scale(.9)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:260,easing:'cubic-bezier(.2,.9,.3,1.2)'});
 card.querySelectorAll('.dist span').forEach((s,i)=>{const w=s.dataset.w+'%';if(RM)s.style.width=w;else{s.style.width=w;anim(s,[{width:'0%'},{width:w}],{duration:500,delay:150+i*60,fill:'backwards',easing:'ease-out'})}});
 document.getElementById('pa').onclick=newGame;document.getElementById('cl').onclick=()=>{modal.style.display='none'};
}
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='Enter'&&modal.style.display==='flex'){newGame();return}key(e.key)});
