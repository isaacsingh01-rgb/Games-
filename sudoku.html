<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sudoku</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f4f1ea;color:#222;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:14px;user-select:none}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
select,button{background:#fff;color:#222;border:1px solid #bbb;border-radius:6px;padding:8px 12px;font-size:15px;cursor:pointer;transition:transform .12s,background .15s,color .15s,border-color .15s}
button:hover{background:#f0f0f0}button:active{transform:scale(.93)}
button.on{background:#2563eb;color:#fff;border-color:#2563eb}
#b{display:grid;grid-template-columns:repeat(9,1fr);width:min(94vw,450px);aspect-ratio:1;border:3px solid #222;background:#222;gap:1px}
.c{background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5.5vw,28px);position:relative;cursor:pointer;transition:background-color .14s,color .14s}
.c:nth-child(3n):not(:nth-child(9n)){border-right:2px solid #222;margin-right:1px}
.c.r3{border-bottom:2px solid #222;margin-bottom:1px}
.c i{font-style:normal;display:inline-block}
.g{font-weight:700}.u{color:#2563eb}
.c.rel{background:#eef2fb}.c.same{background:#dbe5fb}.c.sel{background:#bfd2fa}
.c.bad{color:#dc2626!important;background:#fde8e8}
.nt{position:absolute;inset:1px;display:grid;grid-template-columns:repeat(3,1fr);font-size:clamp(8px,2.2vw,11px);color:#666;line-height:1;pointer-events:none}
.nt span{display:flex;align-items:center;justify-content:center}
#pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;width:min(94vw,450px);margin-top:12px}
#pad button{padding:12px 0;font-size:20px;font-weight:600}
#pad button.done{opacity:.25;transform:scale(.92)}
#st{margin-top:10px;font-weight:700;min-height:22px}
</style></head><body>
<div class="bar">
<select id="df"><option value="36">Easy</option><option value="46" selected>Medium</option><option value="52">Hard</option></select>
<button id="new">New</button><button id="nm">✏️ Notes</button><button id="er">Erase</button><button id="ht">Hint</button><button id="ck">Check</button>
<span id="tm" style="font-variant-numeric:tabular-nums;font-weight:700">0:00</span>
</div>
<div id="b"></div><div id="pad"></div><div id="st"></div>
<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const anim=(el,kf,o)=>{if(!RM&&el&&el.animate)return el.animate(kf,o)};
let sol,giv,cur,notes,sel=-1,notesOn=false,t0,tick,won;
const B=document.getElementById('b'),P=document.getElementById('pad'),ST=document.getElementById('st');
for(let i=0;i<81;i++){const d=document.createElement('div');d.className='c'+(Math.floor(i/9)%3===2&&i<72?' r3':'');d.onclick=()=>{sel=i;draw()};B.appendChild(d)}
for(let n=1;n<=9;n++){const b=document.createElement('button');b.textContent=n;b.onclick=()=>put(n);P.appendChild(b)}
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function ok(g,i,v){const r=Math.floor(i/9),c=i%9;for(let k=0;k<9;k++){if(g[r*9+k]===v&&r*9+k!==i)return false;if(g[k*9+c]===v&&k*9+c!==i)return false}
 const br=r-r%3,bc=c-c%3;for(let a=0;a<3;a++)for(let b=0;b<3;b++){const j=(br+a)*9+bc+b;if(g[j]===v&&j!==i)return false}return true}
function fill(g){const i=g.indexOf(0);if(i<0)return true;for(const v of shuf([1,2,3,4,5,6,7,8,9]))if(ok(g,i,v)){g[i]=v;if(fill(g))return true;g[i]=0}return false}
function count(g,lim){const i=g.indexOf(0);if(i<0)return 1;let n=0;for(let v=1;v<=9&&n<lim;v++)if(ok(g,i,v)){g[i]=v;n+=count(g,lim-n);g[i]=0}return n}
function gen(){
 const s=Array(81).fill(0);fill(s);sol=s.slice();const p=s.slice();
 const rm=+document.getElementById('df').value;let removed=0;
 for(const i of shuf([...Array(81).keys()])){if(removed>=rm)break;const v=p[i];p[i]=0;if(count(p.slice(),2)!==1)p[i]=v;else removed++}
 return p;
}
function newGame(){
 ST.textContent='Generating…';
 setTimeout(()=>{const p=gen();giv=p.map(v=>v!==0);cur=p.slice();notes=Array.from({length:81},()=>new Set());sel=-1;won=false;
  clearInterval(tick);t0=Date.now();document.getElementById('tm').textContent='0:00';
  tick=setInterval(()=>{if(won)return;const s=Math.floor((Date.now()-t0)/1000);document.getElementById('tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},500);
  ST.textContent='';draw();
  [...B.children].forEach((d,i)=>anim(d,[{opacity:0,transform:'scale(.7)'},{opacity:1,transform:'scale(1)'}],{duration:260,delay:(Math.floor(i/9)+i%9)*22,fill:'backwards',easing:'ease-out'}));
 },30);
}
const peers=i=>{const r=Math.floor(i/9),c=i%9,br=r-r%3,bc=c-c%3;return {row:[...Array(9).keys()].map(k=>r*9+k),col:[...Array(9).keys()].map(k=>k*9+c),box:[...Array(9).keys()].map(k=>(br+Math.floor(k/3))*9+bc+k%3)}};
function put(n){
 if(sel<0||giv[sel]||won)return;
 if(notesOn){if(cur[sel])return;notes[sel].has(n)?notes[sel].delete(n):notes[sel].add(n)}
 else{cur[sel]=cur[sel]===n?0:n;notes[sel].clear();
  if(cur[sel]){const p=peers(sel);[...p.row,...p.col,...p.box].forEach(j=>notes[j].delete(n))}}
 draw();
 if(!notesOn&&cur[sel]){
  const p=peers(sel),from=sel;
  const full=[p.row,p.col,p.box].filter(u=>u.every(j=>cur[j]===sol[j]));
  const set=new Set(full.flat());
  if(set.size&&!cur.every((v,i)=>v===sol[i])){const fr=Math.floor(from/9),fc=from%9;
   set.forEach(j=>anim(B.children[j],[{backgroundColor:'#fcd34d',transform:'scale(1.14)'},{transform:'scale(1)'}],{duration:480,delay:Math.hypot(Math.floor(j/9)-fr,j%9-fc)*45,easing:'ease-out'}))}
 }
 checkWin();
}
function conflicts(i){return cur[i]&&!ok(cur,i,cur[i])}
function checkWin(){if(!won&&cur.every((v,i)=>v===sol[i])){won=true;ST.textContent='🎉 Solved in '+document.getElementById('tm').textContent;
 const cr=sel>=0?Math.floor(sel/9):4,cc=sel>=0?sel%9:4;
 [...B.children].forEach((d,i)=>anim(d,[{transform:'scale(1)',backgroundColor:'#fff'},{transform:'scale(1.25)',backgroundColor:'#fde68a',offset:.4},{transform:'scale(1)',backgroundColor:'#fff'}],{duration:620,delay:Math.hypot(Math.floor(i/9)-cr,i%9-cc)*55,easing:'ease-in-out'}));
 anim(ST,[{transform:'scale(.6)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:420,delay:300,fill:'backwards',easing:'cubic-bezier(.2,.9,.3,1.3)'})}}
function draw(){
 const sv=sel>=0?cur[sel]:0,sr=Math.floor(sel/9),sc=sel%9;
 [...B.children].forEach((d,i)=>{
  const r=Math.floor(i/9),c=i%9;let cls='c'+(r%3===2&&r<8?' r3':'');
  if(i===sel)cls+=' sel';else if(sel>=0&&cur[i]&&cur[i]===sv)cls+=' same';else if(sel>=0&&(r===sr||c===sc||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3))))cls+=' rel';
  if(giv[i])cls+=' g';else if(cur[i])cls+=' u';
  const bad=conflicts(i);if(bad)cls+=' bad';
  if(d.className!==cls)d.className=cls;
  const k=cur[i]+'|'+[...notes[i]].sort().join('');
  if(d._k!==k){
   const pv=d._v;d._k=k;d._v=cur[i];
   if(cur[i]){d.innerHTML=`<i>${cur[i]}</i>`;if(!giv[i]&&pv!==cur[i])anim(d.firstChild,[{transform:'scale(.2)',opacity:0},{transform:'scale(1.25)',opacity:1,offset:.6},{transform:'scale(1)'}],{duration:240,easing:'ease-out'})}
   else if(notes[i].size){d.innerHTML='<div class="nt">'+[1,2,3,4,5,6,7,8,9].map(n=>`<span>${notes[i].has(n)?n:''}</span>`).join('')+'</div>';anim(d.firstChild,[{opacity:.2,transform:'scale(.85)'},{opacity:1,transform:'scale(1)'}],{duration:160})}
   else d.textContent='';
  }
  if(bad&&!d._bad)anim(d,[{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(-3px)'},{transform:'translateX(2px)'},{transform:'translateX(0)'}],{duration:320});
  d._bad=bad;
 });
 [...P.children].forEach((b,k)=>b.classList.toggle('done',cur.filter(v=>v===k+1).length>=9));
}
document.getElementById('new').onclick=newGame;
document.getElementById('df').onchange=newGame;
document.getElementById('nm').onclick=e=>{notesOn=!notesOn;e.currentTarget.classList.toggle('on',notesOn)};
document.getElementById('er').onclick=()=>{if(sel>=0&&!giv[sel]&&!won){cur[sel]=0;notes[sel].clear();draw()}};
document.getElementById('ht').onclick=()=>{if(sel<0||giv[sel]||won)return;cur[sel]=sol[sel];notes[sel].clear();draw();
 anim(B.children[sel],[{backgroundColor:'#86efac'},{transform:'scale(1)'}],{duration:500});checkWin()};
document.getElementById('ck').onclick=()=>{if(won)return;const bad=cur.map((v,i)=>v&&v!==sol[i]?i:-1).filter(i=>i>=0);const left=cur.filter(v=>!v).length;
 ST.textContent=bad.length?'Some entries are wrong.':left?`Looks right so far — ${left} cells left.`:'';
 bad.forEach(i=>anim(B.children[i],[{backgroundColor:'#fca5a5'},{transform:'scale(1)'}],{duration:700}));
 anim(ST,[{opacity:0,transform:'translateY(4px)'},{opacity:1,transform:'translateY(0)'}],{duration:220})};
document.addEventListener('keydown',e=>{
 if(e.key>='1'&&e.key<='9'){put(+e.key);return}
 if(e.key==='Backspace'||e.key==='Delete'||e.key==='0'){document.getElementById('er').click();return}
 if(sel<0)return;const m={ArrowLeft:-1,ArrowRight:1,ArrowUp:-9,ArrowDown:9}[e.key];
 if(m){e.preventDefault();const n=sel+m;if(n>=0&&n<81&&!(Math.abs(m)===1&&Math.floor(n/9)!==Math.floor(sel/9))){sel=n;draw()}}
});
newGame();
</script><style>#__home{position:fixed;top:0;left:50%;transform:translateX(-50%);width:64px;height:22px;z-index:99999;display:none;align-items:flex-start;justify-content:center;text-decoration:none}
#__home i{display:block;width:40px;height:15px;border-radius:0 0 10px 10px;background:rgba(120,130,150,.55);color:#fff;font:600 11px/15px system-ui;text-align:center;font-style:normal}
@media (display-mode:standalone){#__home{display:flex}}</style>
<a id="__home" href="./" aria-label="Back to games"><i>⌂ Home</i></a>
<script>if(window.navigator.standalone)document.getElementById('__home').style.display='flex'</script>
</body></html>
