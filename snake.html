<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snake</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1a14;color:#d7f5e1;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:14px;touch-action:none;user-select:none}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.stat{background:#0a110d;border-radius:6px;padding:6px 12px;font-weight:700;min-width:80px;text-align:center;display:inline-block}
select,button{background:#1d3328;color:#d7f5e1;border:1px solid #2f5242;border-radius:6px;padding:8px 12px;font-size:15px;cursor:pointer;transition:transform .12s,filter .15s}
button:hover{filter:brightness(1.2)}button:active{transform:scale(.94)}
canvas{background:#0a110d;border-radius:8px;width:min(94vw,70vh,420px);aspect-ratio:1;touch-action:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
small{opacity:.7;margin-top:10px}
</style></head><body>
<div class="bar"><span class="stat" id="sc">Score 0</span><span class="stat" id="hi">Best 0</span>
<select id="sp"><option value="140">Normal</option><option value="190">Slow</option><option value="95">Fast</option></select>
<button id="pb">Pause</button><button id="nb">New</button></div>
<canvas id="cv"></canvas>
<small>Arrows / WASD / swipe · Space pauses · walls wrap</small>
<script>
const W=420,G=21,S=W/G,RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('cv'),x=cv.getContext('2d');
const dpr=Math.min(devicePixelRatio||1,3);cv.width=cv.height=Math.round(W*dpr);
let snake,prev,dir,queue,food,foodT,score,hi=0,alive,paused,started,interval,nextTick,lastT,deadAt,fx,ovA=0;
try{hi=+localStorage.getItem('snakeHi')||0}catch(e){}
const scEl=document.getElementById('sc'),hiEl=document.getElementById('hi');
const mod=(v)=>((v%G)+G)%G;
function spawn(){do{food={x:Math.floor(Math.random()*G),y:Math.floor(Math.random()*G)}}while(snake.some(s=>s.x===food.x&&s.y===food.y));foodT=performance.now()}
function reset(){
 snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];prev=snake.map(s=>({...s}));dir={x:1,y:0};queue=[];score=0;alive=true;paused=false;started=false;
 interval=+document.getElementById('sp').value;lastT=0;fx=[];deadAt=0;spawn();hud();
}
function hud(bump){
 scEl.textContent='Score '+score;hiEl.textContent='Best '+hi;document.getElementById('pb').textContent=paused?'Resume':'Pause';
 if(bump&&!RM)scEl.animate([{transform:'scale(1)'},{transform:'scale(1.25)',color:'#86efac'},{transform:'scale(1)'}],{duration:220});
}
function step(now){
 if(queue.length)dir=queue.shift();
 prev=snake.map(s=>({...s}));
 const h={x:mod(snake[0].x+dir.x),y:mod(snake[0].y+dir.y)};
 const tail=snake[snake.length-1],eat=h.x===food.x&&h.y===food.y;
 if(snake.some((s,i)=>s.x===h.x&&s.y===h.y&&(eat||s!==tail))){alive=false;deadAt=now;prev=snake.map(s=>({...s}));hud();return}
 snake.unshift(h);
 if(eat){score+=10;if(score>hi){hi=score;try{localStorage.setItem('snakeHi',hi)}catch(e){}}
  fx.push({x:food.x,y:food.y,t:now,type:'ring'},{x:food.x,y:food.y,t:now,type:'text'});spawn();hud(true)}
 else snake.pop();
}
function turn(dx,dy){
 if(!alive)reset();
 const last=queue.length?queue[queue.length-1]:dir;
 if(!(dx===last.x&&dy===last.y)&&!(dx===-last.x&&dy===-last.y)&&queue.length<2)queue.push({x:dx,y:dy});
 if(!started){started=true;paused=false;nextTick=performance.now()+interval;lastT=0;hud()}
}
function togglePause(){
 if(!alive||!started)return;
 paused=!paused;if(!paused)nextTick=performance.now()+interval*(1-lastT);hud();
}
function seg(k,t){
 const a=prev[k]||prev[prev.length-1],b=snake[k];
 let dx=b.x-a.x,dy=b.y-a.y;if(dx>1)dx-=G;if(dx<-1)dx+=G;if(dy>1)dy-=G;if(dy<-1)dy+=G;
 return [mod(a.x+dx*t),mod(a.y+dy*t)];
}
function rr(px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath()}
function box(px,py,size,color){
 x.fillStyle=color;
 const xs=px<1?[0,G]:px>G-1?[0,-G]:[0],ys=py<1?[0,G]:py>G-1?[0,-G]:[0];
 for(const ox of xs)for(const oy of ys){rr((px+ox)*S+(S-size)/2,(py+oy)*S+(S-size)/2,size,size,size*.36);x.fill()}
}
function render(now,t){
 x.setTransform(dpr,0,0,dpr,0,0);
 x.fillStyle='#0a110d';x.fillRect(0,0,W,W);
 x.save();
 if(!alive){const k=Math.max(0,1-(now-deadAt)/420);x.translate(Math.sin(now/16)*6*k,Math.cos(now/21)*4*k)}
 x.fillStyle='#0f1d15';for(let i=0;i<G;i++)for(let j=0;j<G;j++)if((i+j)%2)x.fillRect(i*S,j*S,S,S);
 // food
 const fa=Math.max(0,Math.min(1,(now-foodT)/220)),pulse=1+.09*Math.sin(now/170),ease=fa*(2-fa);
 x.save();x.shadowColor='rgba(239,68,68,.8)';x.shadowBlur=10;x.fillStyle='#ef4444';
 x.beginPath();x.arc((food.x+.5)*S,(food.y+.5)*S,S*.34*pulse*ease,0,7);x.fill();x.restore();
 x.fillStyle='#4ade80';x.beginPath();x.ellipse((food.x+.5)*S+3,(food.y+.5)*S-S*.36*ease,3.2*ease,1.8*ease,-.6,0,7);x.fill();
 // snake
 const L=snake.length,P=[];for(let k=0;k<L;k++)P.push(seg(k,t));
 const d=alive?0:Math.min(1,(now-deadAt)/500);
 const colour=k=>{const f=L>1?k/(L-1):0;return k===0?`hsl(${142-d*142},${65*(1-d)+d*60}%,${72-d*18}%)`:`hsl(${142-d*142},${(65-8*f)*(1-d)+d*50}%,${50-18*f-d*8}%)`};
 const size=k=>(S-3)*(1-.28*(L>1?k/(L-1):0));
 for(let k=L-1;k>=0;k--){
  if(k<L-1){const a=P[k],b=P[k+1];let dx=b[0]-a[0],dy=b[1]-a[1];if(dx>G/2)dx-=G;if(dx<-G/2)dx+=G;if(dy>G/2)dy-=G;if(dy<-G/2)dy+=G;
   box(mod(a[0]+dx/2),mod(a[1]+dy/2),size(k+1)*.98,colour(k+1))}
  box(P[k][0],P[k][1],size(k),colour(k));
 }
 // eyes
 {const [hx,hy]=P[0],cx=(hx+.5)*S,cy=(hy+.5)*S,px=-dir.y,py=dir.x;
  for(const s of [-1,1]){const ex=cx+dir.x*S*.16+px*s*S*.2,ey=cy+dir.y*S*.16+py*s*S*.2;
   x.fillStyle='#fff';x.beginPath();x.arc(ex,ey,S*.13,0,7);x.fill();
   x.fillStyle=alive?'#0a110d':'#7f1d1d';x.beginPath();x.arc(ex+dir.x*S*.05,ey+dir.y*S*.05,S*.07,0,7);x.fill()}}
 // effects
 fx=fx.filter(f=>now-f.t<(f.type==='ring'?450:650));
 for(const f of fx){
  if(f.type==='ring'){const k=(now-f.t)/450;x.strokeStyle=`rgba(252,165,165,${1-k})`;x.lineWidth=3*(1-k)+1;x.beginPath();x.arc((f.x+.5)*S,(f.y+.5)*S,S*(.4+k*1.5),0,7);x.stroke()}
  else{const k=(now-f.t)/650;x.fillStyle=`rgba(255,255,255,${1-k})`;x.font='bold 15px system-ui';x.textAlign='center';x.fillText('+10',(f.x+.5)*S,(f.y-.1-k*1.4)*S)}
 }
 x.restore();
 // overlay (fades in/out)
 const target=!alive?.62:(!started||paused)?.5:0;
 ovA+=(target-ovA)*(RM?1:.18);
 if(ovA>.01){x.fillStyle=`rgba(0,0,0,${ovA})`;x.fillRect(0,0,W,W);
  const txt=!alive?'Game over — press an arrow':!started?'Press an arrow or swipe to start':'Paused';
  x.globalAlpha=Math.min(1,ovA/target||0);x.fillStyle='#fff';x.font='bold 22px system-ui';x.textAlign='center';x.fillText(txt,W/2,W/2);
  if(!alive){x.font='16px system-ui';x.fillStyle='#bbf7d0';x.fillText('Score '+score,W/2,W/2+28)}
  x.globalAlpha=1}
}
function loop(now){
 requestAnimationFrame(loop);
 if(alive&&started&&!paused){
  if(now>=nextTick){if(now-nextTick>interval*3)nextTick=now;step(now);nextTick+=interval}
  lastT=Math.max(0,Math.min(1,1-(nextTick-now)/interval));
 }
 render(now,alive?lastT:1);
}
document.addEventListener('keydown',e=>{
 const m={ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0],ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1]}[e.key];
 if(m){e.preventDefault();turn(...m)}else if(e.key===' '){e.preventDefault();togglePause()}
});
let sx=null,sy;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchmove',e=>{if(sx==null)return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
 if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',()=>sx=null);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&alive&&started&&!paused)togglePause()});
document.getElementById('pb').onclick=togglePause;
document.getElementById('nb').onclick=reset;
document.getElementById('sp').onchange=reset;
reset();requestAnimationFrame(loop);
</script><style>#__home{position:fixed;top:0;left:50%;transform:translateX(-50%);width:64px;height:22px;z-index:99999;display:none;align-items:flex-start;justify-content:center;text-decoration:none}
#__home i{display:block;width:40px;height:15px;border-radius:0 0 10px 10px;background:rgba(120,130,150,.55);color:#fff;font:600 11px/15px system-ui;text-align:center;font-style:normal}
@media (display-mode:standalone){#__home{display:flex}}</style>
<a id="__home" href="./" aria-label="Back to games"><i>⌂ Home</i></a>
<script>if(window.navigator.standalone)document.getElementById('__home').style.display='flex'</script>
</body></html>
